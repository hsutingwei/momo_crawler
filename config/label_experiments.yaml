experiments:
  # 1. Rigorous Baseline (Standard Features Only)
  # explicitly drops the interactions to simulate the 'Before' state
  - name: "rigorous_baseline"
    strategy: "hybrid"
    params:
      delta_threshold: 10
      ratio_threshold: 1.0
      use_pos_weight: true
      drop_features: ['price_weighted_arousal', 'price_weighted_novelty']
    train_settings:
      use_class_weight: true
      do_threshold_search: true

  # 2. Rigorous Interaction (Raw Logic)
  # includes the new features we added to data_loader.py
  - name: "rigorous_interaction_raw"
    strategy: "hybrid"
    params:
      delta_threshold: 10
      ratio_threshold: 1.0
      use_pos_weight: true
      # No drop_features -> uses everything in X_dense
    train_settings:
      use_class_weight: true
      do_threshold_search: true
